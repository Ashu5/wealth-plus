name: build-on-commit

on:
  push:
    branches:
      - "main"
      - "dev"
    paths-ignore:
      - "README.md"
      - ".github/workflows/build-on-commit.yml"
      - "src/services/auth-token.ts"

permissions:
  checks: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci
      - run: npm run build